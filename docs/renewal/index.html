:root {
  /* ── 브랜드 ──
     --brand       : 글자가 얹히지 않는 곳에만 (활성 표시선, 테두리, 아이콘)
     --brand-strong: 글자가 얹히는 곳 (버튼 배경, 링크 텍스트). 흰 글자 대비 5.19:1 */
  --brand:        #EA27C2;
  --brand-strong: #C41DA2;
  --brand-press:  #A6178A;
  --brand-050:    #FDF1FA;
  --brand-100:    #F9D9F1;

  /* ── 잉크(텍스트) ── 회색을 옅게 쓰지 않는다 */
  --ink-900: #101014;
  --ink-700: #232328;
  --ink-500: #4A4A52;
  --ink-300: #86868E;

  /* ── 면 ── */
  --base:    #FFFFFF;
  --surface: #F5F5F8;
  --sunken:  #EDEDF1;
  --line:    #E4E4E9;
  --line-strong: #CFCFD6;

  /* ── 상태 ── */
  --success: #12795A;  --success-bg: #E9F5F0;
  --warning: #9A6209;  --warning-bg: #FBF2E4;
  --danger:  #C4342B;  --danger-bg:  #FBECEB;
  --info:    #2A5E9E;  --info-bg:    #ECF1F8;

  /* ── 간격 ── */
  --sp-1: 4px;  --sp-2: 8px;  --sp-3: 12px; --sp-4: 16px;
  --sp-6: 24px; --sp-8: 32px; --sp-12: 48px; --sp-16: 64px; --sp-24: 96px;

  /* ── 라디우스 ── */
  --r-sm: 4px; --r-md: 8px; --r-lg: 12px; --r-xl: 20px; --r-full: 999px;

  /* ── 그림자 ── */
  --shadow-pop:   0 1px 2px rgba(16,16,20,.05), 0 8px 24px rgba(16,16,20,.08);
  --shadow-modal: 0 24px 64px rgba(16,16,20,.16);

  /* ── 레이아웃 ── */
  --w-content: 1280px;
  --w-text: 720px;
  --w-sidebar: 240px;
  --h-topbar: 60px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
[hidden] { display: none !important; }
body {
  font-family: 'Pretendard Variable', Pretendard, -apple-system, system-ui, sans-serif;
  background: var(--base);
  color: var(--ink-700);
  font-size: 15px;
  line-height: 1.65;
  word-break: keep-all;
  overflow-wrap: break-word;
  -webkit-font-smoothing: antialiased;
}
:focus-visible { outline: 2px solid var(--brand-strong); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

/* 타이포 — 한 화면에 4종류까지 */
.t-title   { font-size: 32px; line-height: 1.25; font-weight: 700; letter-spacing: -.02em; color: var(--ink-900); }
.t-display { font-size: 48px; line-height: 1.1;  font-weight: 700; letter-spacing: -.03em; color: var(--ink-900); font-variant-numeric: tabular-nums; }
.t-section { font-size: 22px; line-height: 1.4;  font-weight: 600; letter-spacing: -.02em; color: var(--ink-900); }
.t-cap     { font-size: 13px; line-height: 1.55; font-weight: 500; color: var(--ink-500); }
.num { font-variant-numeric: tabular-nums; }
.pos { color: var(--success); }
.neg { color: var(--danger); }

.btn { display:inline-flex; align-items:center; justify-content:center; gap: var(--sp-2);
       height: 44px; padding: 0 20px; border: 0; border-radius: var(--r-md);
       font: 600 15px/1 inherit; cursor: pointer; transition: background .15s ease; }
.btn-primary { background: var(--brand-strong); color: #fff; }
.btn-primary:hover { background: var(--brand-press); }
.btn-primary:disabled { background: var(--sunken); color: var(--ink-300); cursor: not-allowed; }
.btn-secondary { background: var(--base); color: var(--ink-900); box-shadow: inset 0 0 0 1px var(--line-strong); }
.btn-secondary:hover { background: var(--surface); }
.btn-sm { height: 36px; padding: 0 14px; }

.badge { display:inline-flex; align-items:center; height:24px; padding:0 10px;
         border-radius: var(--r-sm); font-size:12px; font-weight:600; white-space: nowrap; }
.badge-wait { background: var(--warning-bg); color: var(--warning); }
.badge-prog { background: var(--info-bg);    color: var(--info); }
.badge-done { background: var(--success-bg); color: var(--success); }
.badge-rejt { background: var(--danger-bg);  color: var(--danger); }

.card { background: var(--base); border: 1px solid var(--line); border-radius: var(--r-lg); padding: var(--sp-6); }
.card-flush { padding: 0; }

/* ── 셸 ── */
.shell { display: grid; grid-template-columns: var(--w-sidebar) minmax(0, 1fr); min-height: 100vh; }
aside { background: var(--surface); position: sticky; top: 0; align-self: start;
        max-height: 100vh; overflow-y: auto; padding: var(--sp-6) 0 var(--sp-8);
        display: flex; flex-direction: column; gap: var(--sp-8); }
.brand { padding: 0 var(--sp-6); display: flex; flex-direction: column; }
.brand .nm { font-size: 17px; font-weight: 600; color: var(--ink-900); letter-spacing: -.01em; }
nav { display: flex; flex-direction: column; gap: var(--sp-6); }
.grp { display: flex; flex-direction: column; }
.grp > .gl { padding: 0 var(--sp-6) var(--sp-2); font-size: 13px; font-weight: 600; color: var(--ink-500); }
.nbtn { appearance: none; border: 0; background: transparent; cursor: pointer; width: 100%;
        height: 44px; padding: 0 var(--sp-6); text-align: left; display: flex; align-items: center;
        gap: var(--sp-2); font: 400 15px/1.65 inherit; color: var(--ink-700);
        border-left: 3px solid transparent; transition: background .15s ease, color .15s ease; }
.nbtn:hover { background: var(--sunken); }
.nbtn .v { margin-left: auto; font-size: 13px; font-weight: 500; font-variant-numeric: tabular-nums; color: var(--ink-500); }
.nbtn[aria-selected="true"] { background: var(--brand-050); color: var(--brand-strong);
                              font-weight: 600; border-left-color: var(--brand); }
.nbtn[aria-selected="true"] .v { color: var(--brand-strong); }
.sidefoot { margin-top: auto; padding: var(--sp-4) var(--sp-6) 0; font-size: 13px;
            line-height: 1.55; color: var(--ink-500); }

main { min-width: 0; display: flex; flex-direction: column; }
.topbar { height: var(--h-topbar); flex: none; border-bottom: 1px solid var(--line);
          padding: 0 var(--sp-8); display: flex; align-items: center; justify-content: space-between;
          gap: var(--sp-6); background: var(--base); position: sticky; top: 0; z-index: 8; }
.tb-left { display: flex; align-items: center; gap: var(--sp-3); min-width: 0; }
.tb-right { display: flex; align-items: center; gap: var(--sp-4); }
.stamp { font-size: 13px; font-weight: 500; color: var(--ink-500); white-space: nowrap; }
.stamp b { color: var(--ink-700); font-weight: 600; font-variant-numeric: tabular-nums; }
.page { padding: var(--sp-8) var(--sp-8) var(--sp-24); max-width: calc(var(--w-content) + var(--sp-16)); width: 100%; }
.page > .t-title { margin-bottom: var(--sp-6); }
.view { display: flex; flex-direction: column; gap: var(--sp-16); }
.block { display: flex; flex-direction: column; gap: var(--sp-3); }
.block > .t-section + .t-cap { margin-top: calc(var(--sp-2) - var(--sp-3)); }
.meta { display: flex; flex-wrap: wrap; gap: var(--sp-2) var(--sp-4); font-size: 13px;
        font-weight: 500; color: var(--ink-500); }
.meta b { color: var(--ink-700); font-weight: 600; font-variant-numeric: tabular-nums; }

/* ── OKR 게이지 ── */
.okr-head { display: flex; justify-content: space-between; align-items: flex-start;
            gap: var(--sp-8); flex-wrap: wrap; margin-bottom: var(--sp-6); }
.okr-head .t-cap { margin-top: var(--sp-2); max-width: var(--w-text); }
.dues { display: flex; gap: var(--sp-8); flex: none; }
.due { display: flex; flex-direction: column; }
.due .d { font-size: 22px; font-weight: 600; line-height: 1.4; letter-spacing: -.02em;
          color: var(--ink-900); font-variant-numeric: tabular-nums; }
.gauge { display: flex; flex-direction: column; gap: var(--sp-2); }
.gaxis, .grow { display: grid; grid-template-columns: 56px minmax(0, 1fr) 72px 216px;
                gap: var(--sp-4); align-items: center; }
.gaxis .marks { position: relative; height: 20px; }
.gaxis .marks span { position: absolute; top: 0; font-size: 13px; font-weight: 500;
                     color: var(--ink-500); font-variant-numeric: tabular-nums; white-space: nowrap; }
.gaxis .marks b { color: var(--ink-700); font-weight: 600; }
.grow .ax { font-size: 15px; font-weight: 600; color: var(--ink-900); }
.gtrack { position: relative; height: 32px; background: var(--sunken); border-radius: var(--r-md); }
.gtrack i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: var(--r-md); background: var(--ink-300); }
.gtrack i.now { background: var(--ink-900); }
.gtrack .tk { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--line-strong); }
.gtrack .tk.goal { width: 2px; background: var(--ink-900); margin-left: -2px; }
.gpct { font-size: 15px; font-weight: 600; color: var(--ink-900); font-variant-numeric: tabular-nums; text-align: right; }
.gpct.key { font-size: 22px; font-weight: 700; letter-spacing: -.02em; color: var(--brand); }
.grow .note { font-size: 13px; font-weight: 500; color: var(--ink-500); text-align: right; white-space: nowrap; }
.grow .note b { color: var(--ink-700); font-weight: 600; font-variant-numeric: tabular-nums; }

/* ── 지표 화면 헤더 ── */
.dhead { padding: var(--sp-8); border-bottom: 1px solid var(--line); display: flex;
         flex-wrap: wrap; gap: var(--sp-6) var(--sp-12); align-items: flex-end; }
.dmain { display: flex; flex-direction: column; min-width: 0; }
.dmain .t-display { margin: var(--sp-1) 0; }
.dmain .t-display span { font-size: 15px; font-weight: 600; color: var(--ink-500); letter-spacing: 0; }
.dsub { font-size: 15px; color: var(--ink-700); }
.dsub b { font-weight: 600; font-variant-numeric: tabular-nums; }
.dstats { display: flex; gap: var(--sp-12); margin-left: auto; flex-wrap: wrap; }
.dstat { display: flex; flex-direction: column; white-space: nowrap; }
.dstat .v { font-size: 22px; font-weight: 600; line-height: 1.4; letter-spacing: -.02em;

      p.push('<text class="s-note" x="' + (sx + 6).toFixed(1) + '" y="' + (TOP + 10) + '">' + esc(opts.splitLabel) + '</text>');

    // 기준선 라벨은 막대 위를 지난다. 뒤에 배경을 깔지 않으면 겹쳐서 못 읽는다.
    function refLabel(text, yy, anchor, cls2) {
      var w = 0;
      for (var i = 0; i < text.length; i++) w += text.charCodeAt(i) > 0x1100 ? 13.5 : 7.2;
      var x = anchor === 'end' ? (W - PADR) : (PADL + 2);
      var rx = anchor === 'end' ? x - w - 8 : x - 4;
      return '<rect x="' + rx.toFixed(1) + '" y="' + (yy - 16).toFixed(1) + '" width="' + (w + 12).toFixed(1) +
        '" height="20" fill="var(--base)"/><text class="' + cls2 + '" x="' + x + '" y="' + yy.toFixed(1) +
        '" text-anchor="' + anchor + '">' + esc(text) + '</text>';
    }
    p.push('<line class="ref-avg" x1="' + PADL + '" y1="' + y(opts.avg).toFixed(1) + '" x2="' + (W - PADR) + '" y2="' + y(opts.avg).toFixed(1) + '"/>');
    p.push(refLabel(opts.avgLabel, y(opts.avg) - 6, 'start', 's-avg'));
    p.push('<line class="ref-goal" x1="' + PADL + '" y1="' + y(opts.goal).toFixed(1) + '" x2="' + (W - PADR) + '" y2="' + y(opts.goal).toFixed(1) + '"/>');
    p.push(refLabel(opts.goalLabel, y(opts.goal) - 6, 'end', 's-goal'));
    p.push('<line class="gl-z" x1="' + PADL + '" y1="' + BASE + '" x2="' + (W - PADR) + '" y2="' + BASE + '"/>');

    series.forEach(function (d, i) {
      p.push('<text class="s-cat" x="' + cx(i).toFixed(1) + '" y="262" text-anchor="middle">' + esc(d.label) + '</text>');
      p.push('<text class="' + (d.latest ? 's-hi' : 's-val') + '" x="' + cx(i).toFixed(1) + '" y="280" text-anchor="middle">' + n(d.value) + '</text>');
      if (d.note) p.push('<text class="s-note" x="' + cx(i).toFixed(1) + '" y="298" text-anchor="middle">' + esc(d.note) + '</text>');
    });
    p.push('</svg>');
    return '<div class="scroll-x">' + p.join('') + '</div>';
  }

  function niceMax(vals, goal) {
    var m = Math.max.apply(null, vals.concat([goal])) * 1.08;
    var step = Math.pow(10, Math.floor(Math.log10(m))) / 2;
    return Math.ceil(m / step) * step;
  }
  function ticksFor(max, count) {
    var step = max / count, mag = Math.pow(10, Math.floor(Math.log10(step)));
    var s = [1, 2, 2.5, 5, 10].map(function (k) { return k * mag; })
      .filter(function (k) { return k >= step; })[0] || mag * 10;
    var out = [];
    for (var v = s; v < max; v += s) out.push(Math.round(v));
    return out;
  }

  /* ── 화면 조각 ── */
  function gauge() {
    var ratioPct = Math.round((D.okr.ratio - 1) * 100);
    var order = [['mau', 'MAU'], ['wau', 'WAU'], ['dau', 'DAU']];
    var rowsHtml = order.map(function (o) {
      var a = D.axes[o[0]];
      var w = Math.max(0, Math.min(100, a.delta_pct / ratioPct * 100));
      var isNew = a.phase === 'new';
      return '<div class="grow">' +
        '<span class="ax">' + o[1] + '</span>' +
        '<div class="gtrack"><i class="' + (isNew ? 'now' : '') + '" style="width:' + w.toFixed(1) + '%"></i>' +
        '<span class="tk" style="left:0"></span><span class="tk" style="left:50%"></span>' +
        '<span class="tk goal" style="left:100%"></span></div>' +
        '<span class="gpct' + (isNew ? ' key' : '') + '">' + sign(a.delta_pct) + '</span>' +
        '<span class="note">' + n(a.current) + '명 · ' + esc(a.label) + ' <b>' +
        (isNew ? '리뉴얼' : '구 앱') + '</b></span></div>';
    }).join('');

    var dues = order.filter(function (o) { return D.axes[o[0]].due; })
      .sort(function (x, y) { return D.axes[x[0]].due < D.axes[y[0]].due ? -1 : 1; })
      .map(function (o) {
      var a = D.axes[o[0]];
      return '<div class="due"><span class="d">' + dday(a.due) + '</span>' +
        '<span class="t-cap">리뉴얼 ' + o[1] + ' 확정 ' + md(a.due) + '</span></div>';
    }).join('');

    return '<div class="card">' +
      '<div class="okr-head"><div>' +
        '<h2 class="t-section">' + D.okr.base_year + '년 평균 대비, 리뉴얼 이후 이용자 +' + ratioPct + '%</h2>' +
        '<p class="t-cap">세 축 모두 같은 기준으로 본다. ' + D.okr.base_year +
        '년 실측 평균을 0%로 놓고, 지금 그 위 몇 퍼센트에 있는지만 잰다.</p>' +
      '</div><div class="dues">' + dues + '</div></div>' +
      '<div class="gauge"><div class="gaxis" aria-hidden="true"><div></div>' +
        '<div class="marks"><span style="left:0">' + D.okr.base_year + '년 평균 <b>0%</b></span>' +
        '<span style="left:50%; transform:translateX(-50%)"><b>+' + Math.round(ratioPct / 2) + '%</b></span>' +
        '<span style="right:0">목표 <b>+' + ratioPct + '%</b></span></div><div></div><div></div></div>' +
        rowsHtml + '</div></div>';
  }

  function viewSummary() {
    var dau = D.axes.dau, mau = D.axes.mau, wau = D.axes.wau;
    var ratioPct = Math.round((D.okr.ratio - 1) * 100);

    var verdict = '<div class="card">' +
      '<h2 class="t-section">리뉴얼 후 유일한 실측인 DAU가 ' + D.okr.base_year + '년 평균을 ' +
      dau.delta_pct.toFixed(1) + '% 넘었다. 목표 +' + ratioPct + '%까지는 아직 절반도 못 왔다.</h2>' +
      '<p style="margin-top:var(--sp-3); max-width:var(--w-text)">구 앱의 마지막 성적인 MAU ' +
      sign(mau.delta_pct) + ', WAU ' + sign(wau.delta_pct) + '에서 ' +
      (dau.delta_pct - Math.max(mau.delta_pct, wau.delta_pct)).toFixed(1) +
      '%p 올라선 수준이다. 대규모 개편에서 가장 흔한 초기 이탈은 없었지만, 목표 달성에 필요한 폭에는 크게 못 미친다. ' +
      'MAU와 WAU는 리뉴얼만 담긴 완결 구간이 아직 없어 ' + md(mau.due) + '과 ' + md(wau.due) + '에 확정된다.</p></div>';

    var steps = [{ d: md(D.as_of), t: '현재 · ' + D.window.days + '일차', x: '평일 DAU만 판정 가능' },
                 { d: md(wau.due), t: '리뉴얼 WAU 확정', x: D.window.start.slice(5).replace('-', '/') + '부터 순수 7일 창' },
                 { d: md(mau.due), t: '리뉴얼 MAU 확정', x: 'OKR 첫 성적표' }];
    var plan = '<div class="block"><h3 class="t-section">판정 일정</h3>' +
      '<p class="t-cap">완결 구간이 채워지는 순서다.</p><div class="card plan">' +
      steps.map(function (s) {
        return '<div class="pstep"><span class="d">' + s.d + '</span><span class="t">' + s.t +
          '</span><span class="t-cap">' + s.x + '</span></div>';
      }).join('') + '</div></div>';

    var maxAbs = Math.max.apply(null, D.cumulative.map(function (c) { return Math.abs(c.pct); }));
    var span = Math.ceil((maxAbs * 1.15) / 5) * 5, zero = 20;
    var rowsHtml = D.cumulative.map(function (c) {
      var w = Math.abs(c.pct) / span * (100 - zero);
      var left = c.pct >= 0 ? zero : zero - w;
      var fmt = function (v) { return c.digits ? Number(v).toFixed(c.digits) : n(v); };
      return '<div class="drow"><span class="dname">' + esc(c.name) +
        (c.sub ? '<span class="sub">' + esc(c.sub) + '</span>' : '') + '</span>' +
        '<span class="val">' + fmt(c.value) + '</span><span class="val base">' + fmt(c.base) + '</span>' +
        '<span class="dbar"><span class="zero" style="left:' + zero + '%"></span>' +
        '<i style="left:' + left.toFixed(1) + '%; width:' + w.toFixed(1) + '%; background:var(--' +
        (c.pct >= 0 ? 'success' : 'danger') + ')"></i></span>' +
        '<span class="dchip ' + cls(c.pct) + '">' + sign(c.pct) + '</span></div>';
    }).join('');

    var cum = '<div class="block"><h3 class="t-section">리뉴얼 ' + D.window.days + '일 누적 비교</h3>' +
      '<p class="t-cap">' + md(D.window.start) + '~' + md(D.window.end) +
      '를 직전 4주의 같은 요일 창 평균과 견줬다. 요일 구성을 맞춘 단기 비교다.</p>' +
      '<div class="card card-flush"><div class="drow head"><span>지표</span><span class="r">리뉴얼 후</span>' +
      '<span class="r">기준</span><span>증감 폭</span><span class="r">증감</span></div>' + rowsHtml + '</div></div>';

    return gauge() + verdict + plan + cum;
  }

  function metricView(key, label, unitLabel, series, opts) {
    var a = D.axes[key];
    var vals = series.map(function (s) { return s.value; });
    var max = niceMax(vals, a.target);
    var stats = [{ k: 'OKR 목표', v: n(a.target) }, { k: '남은 폭', v: sign(a.gap_pct) }];
    if (a.due) stats.push({ k: '리뉴얼 확정', v: md(a.due) });
    if (a.prev_pct !== undefined) stats.push({ k: '직전 주 대비', v: sign(a.prev_pct), c: cls(a.prev_pct) });

    return '<div class="card card-flush"><div class="dhead"><div class="dmain">' +
      '<span class="t-cap">' + esc(label) + '</span>' +
      '<span class="t-display">' + n(a.current) + '<span>명</span></span>' +
      '<span class="dsub">' + D.okr.base_year + '년 ' + esc(unitLabel) + ' ' + n(a.baseline) +
      '명 대비 <b class="' + cls(a.delta_pct) + '">' + sign(a.delta_pct) + '</b></span></div>' +
      '<div class="dstats">' + stats.map(function (s) {
        return '<div class="dstat"><span class="t-cap">' + s.k + '</span><span class="v ' +
          (s.c || '') + '">' + s.v + '</span></div>'; }).join('') + '</div></div>' +
      '<div class="dbody">' +
      chart(series, {
        max: max, ticks: ticksFor(max, 4), goal: a.target,
        goalLabel: 'OKR 목표 ' + n(a.target),
        avg: a.baseline, avgLabel: D.okr.base_year + '년 ' + unitLabel + ' ' + n(a.baseline),
        split: opts.split, splitLabel: opts.splitLabel, alt: opts.alt
      }) +
      '<div class="legend">' + opts.legend + '</div>' +
      '<figcaption>' + opts.caption + '</figcaption></div></div>';
  }

  function viewMau() {
    var s = D.series.mau.map(function (m, i, arr) {
      return { label: m.label, value: m.value, kind: 'new',
        latest: i === arr.length - 1, note: i === arr.length - 1 ? '최근 완결월' : '',
        tip: m.label + '\nMAU ' + n(m.value) + '명\n' + D.okr.base_year + '년 평균 대비 ' +
             sign(Math.round((m.value / D.axes.mau.baseline - 1) * 1000) / 10) };
    });
    var a = D.axes.mau, best = D.series.mau.reduce(function (x, y) { return y.value > x.value ? y : x; });
    return metricView('mau', 'MAU · 최근 완결월 ' + a.label + ' · 구 앱', '평균', s, {
      alt: D.as_of.slice(0, 4) + '년 완결월 MAU 막대그래프. 모든 달이 OKR 목표선 아래에 있다.',
      legend: '<span><i style="background:var(--info)"></i>월별 MAU</span>' +
        '<span><i style="background:var(--ink-900)"></i>' + a.label + '</span>' +
        '<span><i class="ln"></i>OKR 목표 ' + n(a.target) + '명</span>' +
        '<span><i class="ln avg"></i>' + D.okr.base_year + '년 평균 ' + n(a.baseline) + '명</span>',
      caption: D.as_of.slice(0, 4) + '년 완결 ' + D.series.mau.length +
        '개월이 모두 목표선 아래다. 최고치였던 ' + best.label + ' ' + n(best.value) + '명도 목표의 ' +
        (best.value / a.target * 100).toFixed(1) + '%였다. <b>다음 달 MAU가 ' + n(a.target) +
        '명을 넘어야 OKR이 성립한다.</b> 리뉴얼 첫 완결월이라 이 수치가 실질적인 첫 성적표다.'
    });
  }

  function viewWau() {
    var a = D.axes.wau;
    var splitIdx = -1;
    var s = D.series.wau.map(function (w, i) {
      if (w.kind === 'mixed' && splitIdx < 0) splitIdx = i;
      return { label: w.label, value: w.value, kind: w.kind, latest: w.latest,
        note: w.latest ? '구 앱 마지막' : (w.kind === 'mixed' ? '혼재 · 판정 제외' : ''),
        tip: w.label + ' 주\nWAU ' + n(w.value) + '명\n' +
             (w.kind === 'mixed' ? '구 앱과 리뉴얼이 섞여 판정에 쓰지 않는다'
                                 : D.okr.base_year + '년 평균 대비 ' + sign(Math.round((w.value / a.baseline - 1) * 1000) / 10)) };
    });
    return metricView('wau', 'WAU · 마지막 완결주 ' + a.label + ' · 구 앱', '주 평균', s, {
      alt: '주간 순이용자 막대그래프. 목표선을 넘은 주는 없다.',
      legend: '<span><i style="background:var(--info)"></i>주간 WAU</span>' +
        '<span><i style="background:var(--ink-900)"></i>구 앱 마지막 완결주</span>' +
        '<span><i style="background:var(--sunken)"></i>구 앱·리뉴얼 혼재 주</span>' +
        '<span><i class="ln"></i>OKR 목표 ' + n(a.target) + '명</span>',
      caption: '7일 순이용자는 매주 GA4에 다시 물어본 실측이다. 일별 값을 더하면 중복 제거가 풀려 순이용자가 되지 않는다. ' +
        '<b>분리 기준일을 걸친 주는 구 앱과 리뉴얼이 섞여 판정에 쓰지 않는다.</b> 리뉴얼만 담긴 첫 7일 창은 ' +
        md(a.due) + '에 확정된다.'
    });
  }

  function viewDau() {
    var a = D.axes.dau, e = D.evidence;
    var splitIdx = D.series.dau.findIndex(function (d) { return d.kind === 'new'; });
    var s = D.series.dau.map(function (d) {
      return { label: d.label, value: d.value, kind: d.kind, latest: d.latest,
        note: d.kind === 'deploy' ? '배포일' : '',
        tip: d.label + ' · ' + (d.kind === 'old' ? '구 앱' : d.kind === 'deploy' ? '배포일' : '리뉴얼') +
             '\n' + n(d.value) + '명' + (d.kind === 'deploy' ? '\n배포 전후가 섞여 어느 쪽에도 넣지 않는다' : '') };
    });
    return metricView('dau', 'DAU · 리뉴얼 ' + a.label + ' 평균', '평일 평균', s, {
      split: splitIdx, splitLabel: '리뉴얼 시작',
      alt: '평일 일별 순이용자 막대그래프. 리뉴얼 첫날 이후 내려간다.',
      legend: '<span><i style="background:var(--ink-300)"></i>구 앱</span>' +
        '<span><i style="background:var(--sunken)"></i>배포일 · 혼재</span>' +
        '<span><i style="background:var(--info)"></i>리뉴얼</span>' +
        '<span><i style="background:var(--ink-900)"></i>리뉴얼 1일차</span>' +
        '<span><i class="ln"></i>OKR 목표 ' + n(a.target) + '명</span>',
      caption: '주말은 빼고 평일만 그렸다. ' + D.okr.base_year + '년 주말 평균은 ' + n(D.baseline.dau_weekend) +
        '명으로 평일 ' + n(a.baseline) + '명의 ' + Math.round(D.baseline.dau_weekend / a.baseline * 100) +
        '% 수준이라, 섞으면 기준선이 무너진다. <b>리뉴얼 첫날은 목표선을 넘었지만 ' +
        e.dau_last.label + ' ' + n(e.dau_last.value) + '명까지 내려왔다.</b> 초기 관심 소진으로 추정하며, ' +
        '2주차가 ' + D.okr.base_year + '년 평일 평균선 위로 복귀하는지가 다음 판정점이다.'
    });
  }

  function viewBase() {
    var b = D.baseline, y = D.okr.base_year;
    var how = [
      ['MAU', D.axes.mau, y + '년 월간 순이용자 ' + b.mau_n + '개 값의 평균', '합계 ' + n(b.mau_sum) + ' ÷ ' + b.mau_n],
      ['WAU', D.axes.wau, y + '년 완결주 ' + b.wau_n + '주 평균',
       '연초·연말에 걸친 부분주 ' + b.wau_part + '주는 7일이 안 차 제외'],
      ['DAU', D.axes.dau, y + '년 평일 ' + b.dau_n + '일 평균',
       '주말 ' + b.dau_weekend_n + '일 평균은 ' + n(b.dau_weekend) + '명. 함께 넣으면 ' +
       n(b.dau_all) + '명까지 눌려 기준이 왜곡된다']
    ];
    var t1 = '<div class="block"><h3 class="t-section">기준선 세 개</h3>' +
      '<p class="t-cap">축마다 단위가 달라 산출 방식도 다르다. OKR 목표는 각 기준선에 ' +
      D.okr.ratio + '를 곱한 값이다.</p><div class="card card-flush"><div class="tbl-wrap"><table>' +
      '<thead><tr><th>축</th><th class="r">' + y + '년 기준선</th><th class="r">OKR 목표</th><th>산출 방식</th></tr></thead><tbody>' +
      how.map(function (r) {
        return '<tr><td>' + r[0] + '</td><td class="r">' + n(r[1].baseline) + '명</td>' +
          '<td class="r">' + n(r[1].target) + '명</td><td>' + esc(r[2]) +
          '<span class="sub">' + esc(r[3]) + '</span></td></tr>'; }).join('') +
      '</tbody></table></div></div></div>';

    var maxes = ['mau', 'wau', 'dau'].map(function (k) {
      return Math.max.apply(null, b.months.map(function (m) { return m[k]; })); });
    var body = b.months.map(function (m) {
      return '<tr><td>' + m.month + '월</td>' + ['mau', 'wau', 'dau'].map(function (k, i) {
        return '<td class="r">' + n(m[k]) + '<span class="track"><i style="width:' +
          (m[k] / maxes[i] * 100).toFixed(1) + '%"></i></span></td>'; }).join('') + '</tr>';
    }).join('') +
      '<tr class="total"><td>기준선</td>' + ['mau', 'wau', 'dau'].map(function (k, i) {
        return '<td class="r">' + n(D.axes[k].baseline) + '<span class="track"><i style="width:' +
          (D.axes[k].baseline / maxes[i] * 100).toFixed(1) + '%"></i></span></td>'; }).join('') + '</tr>';

    var t2 = '<div class="block"><h3 class="t-section">' + y + '년 월별 실측</h3>' +
      '<p class="t-cap">기준선의 원자료다. 숫자 아래 막대는 해당 축의 연중 최고월 대비 비율이다.</p>' +
      '<div class="card card-flush"><div class="tbl-wrap"><table><thead><tr><th>월</th>' +
      '<th class="r">MAU</th><th class="r">WAU 주 평균</th><th class="r">DAU 평일 평균</th></tr></thead>' +
      '<tbody>' + body + '</tbody></table></div></div>' +
      '<p style="max-width:var(--w-text); margin-top:var(--sp-2)">연휴가 낀 달은 평일 수 자체가 줄어 낮게 나온다. ' +
      '연간 평균을 쓰면 이런 계절 편차가 상쇄된다. 세 지표 모두 중복 제거 지표라 하위 단위를 더해 상위 단위를 ' +
      '만들 수 없어, 월·주·일 각 단위로 GA4에 직접 조회한 실측을 평균 냈다. 참고로 ' + D.as_of.slice(0, 4) +
      '년 완결 ' + b.cur_year_n + '개월의 MAU 평균은 ' + n(b.cur_year_avg) + '명으로 ' + y + '년 평균보다 ' +
      Math.abs(Math.round((b.cur_year_avg / D.axes.mau.baseline - 1) * 1000) / 10).toFixed(1) +
      '% 낮다. 리뉴얼은 이 하락을 뒤집고 목표까지 올려야 하는 출발선에 있다.</p></div>';

    return t1 + t2;
  }

  function viewDiff() {
    var e = D.evidence, a = D.axes, y = D.okr.base_year;
    var pvRow = D.cumulative.filter(function (c) { return c.name.indexOf('화면조회 / ') === 0; })[0];
    var good = [
      { f: sign(a.dau.delta_pct), u: 'DAU · ' + y + '년 평균 대비', h: '배포 직후 이탈이 없었다',
        p: '구 앱의 마지막 성적 ' + sign(a.mau.delta_pct) + ' · ' + sign(a.wau.delta_pct) + '보다 위에서 출발했다. 대규모 리뉴얼에서 가장 흔한 실패인 초기 이탈이 나타나지 않았다.' },
      { f: sign(e.engagement.pct), u: '체류 참여', h: '참여가 두 배 넘게 늘었다',
        p: 'user_engagement ' + n(e.engagement.cur) + '명 대 ' + n(e.engagement.base) + '명. ' +
           D.window.days + '일 내내 예외 없이 상회해 단발 스파이크가 아니다.' },
      { f: sign(e.service.pct), u: '서비스 진입', h: '서비스 탐색이 늘었다',
        p: '서비스 화면 ' + n(e.service.cur) + '명 대 ' + n(e.service.base) + '명. 직전 주 같은 요일 대비다.' },
      { f: sign(pvRow.pct), u: '화면조회 / 1인', h: '1인당 이용 깊이가 늘었다',
        p: pvRow.value.toFixed(2) + '회 대 ' + pvRow.base.toFixed(2) + '회. 1회성 코치마크와 경로 재편이 포함돼 있어, 제외하면 ' +
           sign(e.pv_per_user_ex_pct) + '다.', badge: '추정 · 계측 검증 필요' }
    ];
    var bad = [
      { f: e.gap_pp.toFixed(1) + '%p', u: '목표까지 남은 거리', h: 'OKR 목표와의 거리가 거의 그대로다',
        p: '구 앱 ' + sign(a.mau.delta_pct) + '에서 리뉴얼 ' + sign(a.dau.delta_pct) + '로 ' +
           (a.dau.delta_pct - a.mau.delta_pct).toFixed(1) + '%p 좁혔을 뿐이다. 남은 ' + e.gap_pp.toFixed(1) +
           '%p를 ' + D.window.days + '일치 개선폭으로 메우려면 여러 배가 더 필요하다.' },
      { f: sign(e.dau_decay_pct), u: '1일차 → 마지막 날', h: '초기 상승분이 며칠 만에 감쇠했다',
        p: e.dau_first.label + ' ' + n(e.dau_first.value) + '명에서 ' + e.dau_last.label + ' ' +
           n(e.dau_last.value) + '명으로 내려왔다. 직전 주 평일 평균과 견주면 ' + sign(a.dau.prev_pct) +
           '로 사실상 제자리다. 초기 관심 소진으로 추정한다.', badge: '추정' },
      { f: e.cert.times + '배', u: '회사인증 화면', h: '재인증과 재로그인 마찰이 생겼다',
        p: '회사인증 화면 ' + n(e.cert.cur) + '명 대 ' + n(e.cert.base) + '명, 로그인 화면 ' +
           sign(e.login.pct) + '. 배포로 기존 세션과 회사인증이 초기화된 것으로 추정한다.', badge: '추정' }
    ];
    function panel(title, items, tone) {
      return '<div class="card card-flush"><div class="phead"><h3 class="t-section">' + title +
        '</h3><span class="cnt">' + items.length + '건</span></div>' +
        items.map(function (it) {
          return '<div class="pitem"><div class="pfig ' + tone + '">' + it.f + '<span class="u">' +
            esc(it.u) + '</span></div><div class="pbody"><h4>' + esc(it.h) + '</h4><p>' + it.p + '</p>' +
            (it.badge ? '<span class="badge badge-wait">' + esc(it.badge) + '</span>' : '') +
            '</div></div>'; }).join('') + '</div>';
    }
    return '<div class="cols">' + panel('진보', good, 'pos') + panel('퇴보', bad, 'neg') + '</div>';
  }

  var RENDER = { 't-sum': viewSummary, 't-mau': viewMau, 't-wau': viewWau,
                 't-dau': viewDau, 't-base': viewBase, 't-diff': viewDiff };

  function skeleton() {
    var lines = '';
    for (var i = 0; i < 6; i++) lines += '<div class="skel skel-line" style="width:' + (55 + i * 7) + '%"></div>';
    return '<div class="card"><div class="skel-wrap">' + lines + '</div></div>';
  }

  function paint() {
    if (!D.axes) { app.innerHTML = skeleton(); return; }
    app.innerHTML = '<div class="view" id="' + VIEW[current] + '">' + RENDER[current]() + '</div>';
    document.querySelector('[data-slot="crumb"]').textContent = NAMES[current][0];
    document.querySelector('[data-slot="ptitle"]').textContent = NAMES[current][1];
    ['mau', 'wau', 'dau'].forEach(function (k) {
      document.querySelector('[data-slot="nav-' + k + '"]').textContent = sign(D.axes[k].delta_pct);
    });
    document.querySelector('[data-slot="nav-base"]').textContent = D.baseline.mau_n + '개월';
    document.querySelector('[data-slot="nav-diff"]').textContent = '4 / 3';
    document.querySelector('[data-slot="sidefoot"]').innerHTML =
      'GA4 속성 406530510<br>지표는 activeUsers, 중복 제거 순이용자<br>배포 ' +
      md(D.release.date) + ' · 분리 기준일 ' + md(D.release.split_date);
    document.querySelector('[data-slot="stamp"]').innerHTML =
      '데이터 기준 <b>' + D.last_full + '</b> · 갱신 <b>' + D.generated_at.replace('T', ' ').replace('Z', ' UTC') + '</b>';
  }

  function setConn(kind, text) {
    conn.className = 'badge badge-' + kind;
    conn.textContent = text;
  }

  /* ── 실시간 조회 ────────────────────────────────────────────
     같은 출처의 renewal.json 을 받아 온다. 아티팩트·로컬 파일처럼 외부
     요청이 막힌 곳에서는 실패하는데, 그때는 HTML 안의 스냅샷으로 그린다. */
  function load(manual) {
    if (manual) { setConn('prog', '갱신 중'); }
    return fetch('./renewal.json?t=' + Date.now(), { cache: 'no-store' })
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (json) {
        if (!json.axes) throw new Error('형식이 올바르지 않습니다');
        var changed = json.generated_at !== D.generated_at;
        D = json;
        errBox.hidden = true;
        paint();
        setConn('done', changed && manual ? '갱신 완료' : '실시간');
        return true;
      })
      .catch(function (err) {
        if (D.axes) {
          setConn('wait', '스냅샷');
          if (manual) {
            errBox.hidden = false;
            errMsg.textContent = '최신 데이터를 받지 못해 ' + D.last_full +
              ' 기준 스냅샷을 그대로 보여 주고 있습니다. (' + err.message + ')';
          }
        } else {
          setConn('rejt', '연결 실패');
          errBox.hidden = false;
          errMsg.textContent = '데이터 파일(renewal.json)을 읽을 수 없습니다. (' + err.message + ')';
          app.innerHTML = '';
        }
        return false;
      });
  }

  /* ── 이벤트 ── */
  document.addEventListener('mousemove', function (e) {
    var g = e.target.closest ? e.target.closest('.bar[data-tip]') : null;
    if (!g) { tip.style.opacity = '0'; return; }
    tip.textContent = g.getAttribute('data-tip');
    tip.style.opacity = '1';
    tip.style.left = Math.min(e.clientX + 16, window.innerWidth - 280) + 'px';
    tip.style.top = Math.max(e.clientY - 64, 8) + 'px';
  });

  var tabs = Array.prototype.slice.call(document.querySelectorAll('.nbtn'));
  function select(btn) {
    tabs.forEach(function (t) { t.setAttribute('aria-selected', t === btn ? 'true' : 'false'); });
    current = btn.id;
    if (location.hash !== '#' + btn.id.slice(2)) {
      history.replaceState(null, '', '#' + btn.id.slice(2));
    }
    paint();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
  tabs.forEach(function (t, i) {
    t.addEventListener('click', function () { select(t); });
    t.addEventListener('keydown', function (e) {
      var d = (e.key === 'ArrowDown' || e.key === 'ArrowRight') ? 1
            : (e.key === 'ArrowUp' || e.key === 'ArrowLeft') ? -1 : 0;
      if (!d) return;
      e.preventDefault();
      var next = tabs[(i + d + tabs.length) % tabs.length];
      next.focus(); select(next);
    });
  });
  document.getElementById('reload').addEventListener('click', function () { load(true); });
  document.getElementById('retry').addEventListener('click', function () { load(true); });

  var fromHash = 't-' + (location.hash || '').replace('#', '');
  if (VIEW[fromHash]) {
    current = fromHash;
    tabs.forEach(function (t) { t.setAttribute('aria-selected', t.id === current ? 'true' : 'false'); });
  }
  window.addEventListener('hashchange', function () {
    var id = 't-' + (location.hash || '').replace('#', '');
    if (VIEW[id] && id !== current) {
      var btn = document.getElementById(id);
      if (btn) select(btn);
    }
  });

  paint();
  load(false);
  setInterval(function () { load(false); }, POLL_MS);
})();
</script>

</body>
</html>
