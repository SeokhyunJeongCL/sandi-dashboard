<script>
(function(){
  'use strict';
  var PW_KEY = 'sandi_gate_pw', EXP_KEY = 'sandi_gate_exp';
  var SESSION_MS = 8*60*60*1000;          // 8시간 — CS 대시보드와 동일
  var CHECK_TEXT = 'SANDI-GATE-OK';
  // 이 이름으로 오는 fetch 는 암호화본으로 돌린다.
  var GUARDED = ['data.json', 'ga_detail.json', 'renewal.json', 'buildings.json'];

  var _key = null;                        // 유도된 AES 키 (메모리에만)
  var _unlocked = false;
  var _waiters = [];                      // 잠금 해제를 기다리는 resolve 들
  var _fail = 0, _lockUntil = 0;

  // 가로채기 전 원본을 잡아둔다. 게이트 자신의 요청은 항상 이걸로 보낸다 —
  // 샴을 거치면 재진입 위험이 생기고, 다른 스크립트가 fetch 를 또 감쌌을 때
  // 순서에 따라 동작이 달라진다.
  var _nativeFetch = window.fetch.bind(window);

  function b64(s){ return Uint8Array.from(atob(s), function(c){ return c.charCodeAt(0); }); }

  function getGate(){
    if(getGate._p) return getGate._p;
    getGate._p = _nativeFetch('gate.json', {cache:'no-store'}).then(function(r){
      if(!r.ok) throw new Error('gate.json ' + r.status);
      return r.json();
    });
    return getGate._p;
  }

  function derive(pw, g){
    return crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey'])
      .then(function(mat){
        return crypto.subtle.deriveKey(
          {name:'PBKDF2', salt:b64(g.salt), iterations:g.iter, hash:'SHA-256'},
          mat, {name:'AES-GCM', length:256}, false, ['decrypt']);
      });
  }

  /* 복호화 → (필요시) gzip 해제 → 문자열.
     암호문은 압축이 안 되므로 파이썬 쪽에서 '압축한 뒤 암호화' 한다.
     그래서 푸는 순서도 '복호화 뒤 압축해제' 로 반대다. */
  function decrypt(key, blob){
    return crypto.subtle.decrypt({name:'AES-GCM', iv:b64(blob.iv)}, key, b64(blob.ct))
      .then(function(pt){
        if(blob.z !== 'gzip') return new TextDecoder().decode(pt);
        if(typeof DecompressionStream === 'undefined'){
          throw new Error('이 브라우저는 압축 해제를 지원하지 않습니다. 최신 버전으로 업데이트해주세요.');
        }
        var ds = new DecompressionStream('gzip');
        var w = ds.writable.getWriter();
        w.write(new Uint8Array(pt)); w.close();
        return new Response(ds.readable).text();
      });
  }

  /* 비밀번호 검증 = check 블록 복호화. 서버가 없으므로 '맞는 키인가' 와
     '풀리는가' 는 같은 연산이다. 큰 파일을 받기 전에 판정한다. */
  function unlock(pw){
    return getGate().then(function(g){
      return derive(pw, g).then(function(key){
        return decrypt(key, g.check).then(function(txt){
          if(txt !== CHECK_TEXT) throw new Error('check mismatch');
          _key = key;
        });
      });
    });
  }

  function whenUnlocked(){
    if(_unlocked) return Promise.resolve();
    return new Promise(function(res){ _waiters.push(res); });
  }

  /* 암호화본을 받아 복호화한 뒤, 호출부가 기대하는 Response 모양으로 돌려준다.
     r.ok / r.status / r.json() / r.text() 만 쓰이므로 그만큼만 흉내낸다. */
  function guardedFetch(name){
    return whenUnlocked().then(function(){
      return _nativeFetch(name + '.enc.json', {cache:'no-store'});
    }).then(function(r){
      if(!r.ok) throw new Error(name + '.enc.json ' + r.status);
      return r.json();
    }).then(function(blob){
      return decrypt(_key, blob);
    }).then(function(txt){
      return {
        ok: true, status: 200, statusText: 'OK',
        json: function(){ return Promise.resolve(JSON.parse(txt)); },
        text: function(){ return Promise.resolve(txt); }
      };
    });
  }

  /* 요청 URL 이 보호 대상인지 판별. 'renewal.json?t=169…' 처럼 캐시 무효화
     쿼리가 붙거나 './renewal.json' 처럼 상대경로여도 잡아야 한다. */
  function guardedName(url){
    var path = String(url).split('?')[0].split('#')[0];
    for(var i=0; i<GUARDED.length; i++){
      var n = GUARDED[i];
      if(path === n || path.endsWith('/' + n)) return n.replace(/\.json$/, '');
    }
    return null;
  }

  window.fetch = function(input, init){
    var url = (typeof input === 'string') ? input : (input && input.url);
    var name = url ? guardedName(url) : null;
    if(name) return guardedFetch(name);
    return _nativeFetch(input, init);
  };

  function reveal(){
    _unlocked = true;
    var el = document.getElementById('sandiGate');
    if(el) el.remove();
    var w = _waiters; _waiters = [];
    w.forEach(function(res){ res(); });
  }

  function submit(){
    var now = Date.now();
    var err = document.getElementById('sandiGateErr');
    var btn = document.getElementById('sandiGateBtn');
    var inp = document.getElementById('sandiGatePw');
    if(now < _lockUntil){
      err.textContent = Math.ceil((_lockUntil-now)/1000) + '초 후에 다시 시도해주세요.';
      return;
    }
    var pw = inp.value;
    if(!pw){ err.textContent = '비밀번호를 입력해주세요.'; return; }
    btn.disabled = true;
    err.textContent = '확인 중...';
    unlock(pw).then(function(){
      try{
        sessionStorage.setItem(PW_KEY, pw);
        sessionStorage.setItem(EXP_KEY, String(Date.now()+SESSION_MS));
      }catch(e){ /* 시크릿 모드 등 — 세션 유지만 포기하고 진행 */ }
      _fail = 0; inp.value = ''; err.textContent = '';
      reveal();
    }).catch(function(e){
      /* 무차별 대입 완화: 5회부터 지수 지연, 10회에서 5분 잠금.
         오프라인 대입은 못 막지만 브라우저 경유 시도는 걸러진다. */
      _fail++;
      inp.value = '';
      if(_fail >= 10){
        _lockUntil = Date.now() + 300000;
        err.textContent = '10회 실패. 5분 후 다시 시도해주세요.';
      }else{
        if(_fail >= 5) _lockUntil = Date.now() + Math.min(30, Math.pow(2,_fail-5))*1000;
        err.textContent = '비밀번호가 올바르지 않습니다.';
      }
    }).finally(function(){
      btn.disabled = false;
      inp.focus();
    });
  }

  window.SANDI_GATE = {whenUnlocked:whenUnlocked, isUnlocked:function(){ return _unlocked; }};

  document.addEventListener('DOMContentLoaded', function(){
    var btn = document.getElementById('sandiGateBtn');
    var inp = document.getElementById('sandiGatePw');
    if(btn) btn.addEventListener('click', submit);
    if(inp) inp.addEventListener('keydown', function(e){ if(e.key === 'Enter') submit(); });

    /* 세션 복구: 비밀번호는 탭 세션에만 둔다(탭을 닫으면 사라짐).
       실제 복호화가 성공해야 통과시키므로, 비번을 바꿔 재배포하면
       저장된 값은 자동으로 무효가 되어 재로그인된다. */
    var saved, exp;
    try{
      saved = sessionStorage.getItem(PW_KEY);
      exp = parseInt(sessionStorage.getItem(EXP_KEY) || '0', 10);
    }catch(e){ saved = null; }
    if(saved && exp > Date.now()){
      unlock(saved).then(reveal).catch(function(){
        try{ sessionStorage.removeItem(PW_KEY); sessionStorage.removeItem(EXP_KEY); }catch(e){}
        if(inp) inp.focus();
      });
    }else{
      if(inp) inp.focus();
    }
  });
})();
</script>

  --brand-press:  #A6178A;
  --brand-050:    #FDF1FA;
  --brand-100:    #F9D9F1;

  /* ── 잉크(텍스트) ── 회색을 옅게 쓰지 않는다 */
  --ink-900: #101014;
  --ink-700: #232328;
  --ink-500: #4A4A52;
  --ink-300: #86868E;

  /* ── 면 ── */
  --base:    #FFFFFF;
  --surface: #F5F5F8;
  --sunken:  #EDEDF1;
  --line:    #E4E4E9;
  --line-strong: #CFCFD6;

  /* ── 상태 ── */
  --success: #12795A;  --success-bg: #E9F5F0;
  --warning: #9A6209;  --warning-bg: #FBF2E4;
  --danger:  #C4342B;  --danger-bg:  #FBECEB;
  --info:    #2A5E9E;  --info-bg:    #ECF1F8;

  /* ── 데이터 차트 ── 막대·게이지 채움 전용. 글자에는 쓰지 않는다.
     OKLab ΔE: ctx↔key 36.5 / ctx↔focus 57.1 / key↔focus 24.7
     (protan·deutan·tritan 모두 23 이상) */
  --data-ctx:   #B9B9C4;  /* 비교·과거 구간. 값을 직접 적으므로 옅어도 읽힌다 */
  --data-key:   #2A5E9E;  /* 판정 대상 구간 */
  --data-focus: #101014;  /* 강조 1개 */
  --data-wash:  #F2F6FB;  /* 판정 구간 배경 띠 */

  /* ── 간격 ── */
  --sp-1: 4px;  --sp-2: 8px;  --sp-3: 12px; --sp-4: 16px;
  --sp-6: 24px; --sp-8: 32px; --sp-12: 48px; --sp-16: 64px; --sp-24: 96px;

  /* ── 라디우스 ── */
  --r-sm: 4px; --r-md: 8px; --r-lg: 12px; --r-xl: 20px; --r-full: 999px;

  /* ── 그림자 ── */
  --shadow-pop:   0 1px 2px rgba(16,16,20,.05), 0 8px 24px rgba(16,16,20,.08);
  --shadow-modal: 0 24px 64px rgba(16,16,20,.16);

  /* ── 레이아웃 ── */
  --w-content: 1280px;
  --w-text: 720px;
  --w-sidebar: 240px;
  --h-topbar: 60px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

.btn { display:inline-flex; align-items:center; justify-content:center; gap: var(--sp-2);

.badge-rejt { background: var(--danger-bg);  color: var(--danger); }

.card { background: var(--base); border: 1px solid var(--line); border-radius: var(--r-lg); padding: var(--sp-6); }

/* ── OKR 게이지 ── */

/* ── 차트 ── */
.scroll-x { overflow-x: auto; }
svg.chart { display: block; width: 100%; min-width: 620px; height: auto; }

.ref-goal  { stroke: var(--ink-900); stroke-width: 1; stroke-dasharray: 5 4; }

/* 값 라벨은 기준선·격자를 지나간다. 흰 사각형을 깔지 않고 글자에 흰 테두리를

.chart text { paint-order: stroke fill; stroke: var(--base); stroke-width: 5px;

.s-tick { fill: var(--ink-500); font-size: 12px; font-weight: 500; font-variant-numeric: tabular-nums; }

.bar path.mark { transition: opacity .15s ease; }

.legend { display: flex; flex-wrap: wrap; gap: var(--sp-2) var(--sp-6); font-size: 13px;

.drow { display: grid; grid-template-columns: 208px 112px 112px minmax(120px, 1fr) 80px;

.drow .val { font-size: 15px; text-align: right; font-variant-numeric: tabular-nums; color: var(--ink-900); }

.cols { display: grid; grid-template-columns: 1fr 1fr; gap: var(--sp-6); }

      <button class="nbtn" role="tab" id="t-wau" aria-controls="v-wau" aria-selected="false">WAU<span class="v" data-slot="nav-wau">-</span></button>
      <button class="nbtn" role="tab" id="t-dau" aria-controls="v-dau" aria-selected="false">DAU<span class="v" data-slot="nav-dau">-</span></button>
    </div>
    <div class="grp">
      <span class="gl">기준 · 근거</span>
      <button class="nbtn" role="tab" id="t-base" aria-controls="v-base" aria-selected="false">2025년 측정 기준 및 비교</button>
    </div>
    <div class="grp">
      <span class="gl">분석</span>
      <button class="nbtn" role="tab" id="t-diff" aria-controls="v-diff" aria-selected="false">진보 · 퇴보<span class="v" data-slot="nav-diff">-</span></button>
    </div>

</aside>

<main>
  <div class="topbar">
    <div class="tb-left">
      <span class="t-cap" data-slot="crumb">종합</span>
      <span class="badge badge-prog" id="conn">불러오는 중</span>
    </div>

      <span class="stamp" data-slot="stamp"></span>
      <button class="btn btn-primary btn-sm" id="reload">지금 갱신</button>
    </div>
  </div>

  <div class="page">
    <h1 class="t-title" data-slot="ptitle">요약 · 판정</h1>

    <div id="err" class="card errbox" hidden>
      <p class="t-section">데이터를 불러오지 못했습니다</p>
      <p id="errmsg"></p>

    <div id="app"></div>
  </div>
</main>
</div>

<div class="tip" id="tip"></div>
<script id="snapshot" type="application/json">{}</script>
<script>
(function () {
  'use strict';

  /* ────────────────────────────────────────────────────────────
     데이터 한 곳에서만 온다. 문장에 수치를 박지 않는다 —
     데이터가 갱신돼도 문구만 남아 오정보가 되는 사고를 막는다.
     ──────────────────────────────────────────────────────────── */
  var SNAPSHOT = JSON.parse(document.getElementById('snapshot').textContent || '{}');
  var D = SNAPSHOT;
  var POLL_MS = 5 * 60 * 1000;

  var app = document.getElementById('app');
  var errBox = document.getElementById('err');
  var errMsg = document.getElementById('errmsg');
  var conn = document.getElementById('conn');
  var tip = document.getElementById('tip');
  var current = 't-sum';

  var NAMES = { 't-sum': ['종합', '요약 · 판정'], 't-mau': ['지표 축', 'MAU · 월간 순이용자'],
                't-wau': ['지표 축', 'WAU · 주간 순이용자'], 't-dau': ['지표 축', 'DAU · 일간 순이용자'],
                't-base': ['기준 · 근거', '2025년 측정 기준 및 비교'], 't-diff': ['분석', '진보 · 퇴보'] };
  var VIEW = { 't-sum': 'v-sum', 't-mau': 'v-mau', 't-wau': 'v-wau',
               't-dau': 'v-dau', 't-base': 'v-base', 't-diff': 'v-diff' };
  // 주 격자 앵커 요일 → 그 주의 마지막 요일. '화~월 7일' 처럼 구간을 적는 데 쓴다.
  var WD_PREV = { '월': '일', '화': '월', '수': '화', '목': '수', '금': '목', '토': '금', '일': '토' };

  /* ── 포맷 ── */
  function n(v) { return (v === null || v === undefined) ? '-' : Number(v).toLocaleString('ko-KR'); }
  function sign(p) { return (p > 0 ? '+' : '') + p.toFixed(1) + '%'; }
  // 두 증감률의 차. 부호는 방향을 말하는 낱말로 옮긴다 — '-0.7%p 아래'처럼 겹쳐 적지 않는다.
  function gap(a, b) { return Math.abs(a - b).toFixed(1) + '%p ' + (a >= b ? '위' : '아래'); }
  function cls(p) { return p > 0 ? 'pos' : (p < 0 ? 'neg' : ''); }
  function md(iso) { var d = iso.split('-'); return Number(d[1]) + '/' + Number(d[2]); }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function dday(iso) {
    var t = new Date(D.as_of + 'T00:00:00'), g = new Date(iso + 'T00:00:00');
    var n2 = Math.round((g - t) / 86400000);
    return n2 > 0 ? 'D-' + n2 : (n2 === 0 ? 'D-day' : '완료');
  }

  /* ── 막대 차트 ──────────────────────────────────────────────
     규격은 sandi-frontend-design 스킬 10장(데이터 차트)을 따른다.
       · 막대 22px 이하 · 위쪽만 4px 라운드 · 격자·기준선 1px
       · 값은 막대 머리 위 하나, 카테고리는 축 아래 하나 (2단으로 쌓지 않는다)
       · 기준선 라벨은 플롯 밖 오른쪽 여백에 둔다 — 막대와 절대 겹치지 않는다
     계열이 1개인 차트는 --data-ctx 하나로 그리고 강조 1개만 --data-focus 로
     띄운다. --data-key(파랑)는 계열이 둘일 때(구 앱 vs 리뉴얼)만 쓴다. */
  var FILL = { old: 'var(--data-ctx)', new: 'var(--data-key)', mixed: 'url(#hatch)',
               deploy: 'url(#hatch)', latest: 'var(--data-focus)' };

  // SVG 안에서는 글자 폭을 물어볼 수 없어 근사한다. 한글은 폰트 크기만큼,
  // 숫자·영문은 그 55% 로 본다. 라벨 자리를 잡는 데만 쓴다.
  function tw(text, size) {
    var w = 0;
    for (var i = 0; i < text.length; i++) w += text.charCodeAt(i) > 0x1100 ? size : size * 0.55;
    return w;
  }

  // 슬롯 폭에 맞춰 어절 단위로 접는다. 최대 두 줄.
  function wrap(text, limit, size) {
    var words = text.split(' '), out = [''];
    words.forEach(function (w) {
      var cand = out[out.length - 1] ? out[out.length - 1] + ' ' + w : w;
      if (tw(cand, size) <= limit || !out[out.length - 1]) out[out.length - 1] = cand;
      else out.push(w);
    });
    return out.slice(0, 2);
  }

  // 위쪽 두 모서리만 둥근 막대. 바닥은 각져서 기준선에 붙어 있어야 한다.
  function barPath(x, top, w, hh, r) {
    r = Math.min(r, w / 2, hh);
    var b = top + hh;
    return 'M' + x.toFixed(1) + ' ' + b.toFixed(1) +
      'V' + (top + r).toFixed(1) + 'a' + r + ' ' + r + ' 0 0 1 ' + r + ' -' + r +
      'h' + (w - 2 * r).toFixed(1) + 'a' + r + ' ' + r + ' 0 0 1 ' + r + ' ' + r +
      'V' + b.toFixed(1) + 'Z';
  }

  function chart(series, opts) {
    var PADL = 52, TOP = 44, BASE = 264, CAT = 288, NOTE = 305, H = 324;
    var REF = 12;  // 기준선 라벨 글자 크기
    // 기준선 라벨은 플롯 밖 오른쪽 여백(gutter)에 놓는다. 막대 위에 흰 사각형을
    // 깔고 얹으면 지운 자리가 보인다 — 자리를 아예 비워 두는 편이 깨끗하다.
    var gutter = Math.ceil(Math.max(tw(opts.goalLabel, REF), tw(opts.avgLabel, REF))) + 12;
    var W = 620 + gutter;
    var innerW = W - PADL - gutter, h = BASE - TOP;
    var max = opts.max;
    var y = function (v) { return BASE - (v / max) * h; };
    var col = innerW / series.length;
    var bw = Math.min(22, col * 0.46);
    var cx = function (i) { return PADL + col * (i + 0.5); };
    var right = PADL + innerW;
    var p = [];

    p.push('<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(opts.alt) + '">');
    p.push('<defs><pattern id="hatch" width="8" height="8" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">' +
           '<rect width="8" height="8" fill="var(--sunken)"/>' +
           '<line x1="0" y1="0" x2="0" y2="8" stroke="var(--data-ctx)" stroke-width="2"/></pattern></defs>');

    // 판정 구간 배경 띠 — 구간을 색으로 칠하지 않고 뒤를 옅게 깐다
    var hasSplit = opts.split !== undefined && opts.split > 0 && opts.split < series.length;
    var sx = hasSplit ? PADL + col * opts.split : 0;
    if (hasSplit) {
      p.push('<rect x="' + sx.toFixed(1) + '" y="' + TOP + '" width="' + (right - sx).toFixed(1) +
             '" height="' + h + '" fill="var(--data-wash)"/>');
    }

    opts.ticks.forEach(function (t) {
      p.push('<line class="gl-l" x1="' + PADL + '" y1="' + y(t).toFixed(1) + '" x2="' + right + '" y2="' + y(t).toFixed(1) + '"/>');
      p.push('<text class="s-tick" x="' + (PADL - 10) + '" y="' + (y(t) + 4).toFixed(1) + '" text-anchor="end">' + n(t) + '</text>');
    });

    // 기준선 — 격자와 굵기는 같고 형태로만 구분한다
    function ref(cls2, txt, val, txtCls) {
      var yy = y(val);
      return '<line class="' + cls2 + '" x1="' + PADL + '" y1="' + yy.toFixed(1) + '" x2="' + right +
        '" y2="' + yy.toFixed(1) + '"/><text class="' + txtCls + '" x="' + (right + 8) +
        '" y="' + (yy + 4).toFixed(1) + '">' + esc(txt) + '</text>';
    }
    var refYs = [y(opts.avg), y(opts.goal)];
    p.push(ref('ref-avg', opts.avgLabel, opts.avg, 's-avg'));
    p.push(ref('ref-goal', opts.goalLabel, opts.goal, 's-goal'));
    p.push('<line class="gl-z" x1="' + PADL + '" y1="' + BASE + '" x2="' + right + '" y2="' + BASE + '"/>');

    if (hasSplit) {
      p.push('<line class="ref-split" x1="' + sx.toFixed(1) + '" y1="' + TOP + '" x2="' + sx.toFixed(1) + '" y2="' + BASE + '"/>');
      p.push('<text class="s-note" x="' + (sx + 6).toFixed(1) + '" y="' + (TOP - 12) + '">' + esc(opts.splitLabel) + '</text>');
    }

    series.forEach(function (d, i) {
      var bh = Math.max(3, (d.value / max) * h), top = BASE - bh;
      var fill = d.latest ? FILL.latest : (FILL[d.kind] || FILL.new);
      p.push('<g class="bar" data-tip="' + esc(d.tip) + '">' +
        '<path class="mark" d="' + barPath(cx(i) - bw / 2, top, bw, bh, 4) + '" fill="' + fill + '"/>' +
        '<rect class="hit" x="' + (cx(i) - col / 2).toFixed(1) + '" y="' + TOP + '" width="' + col.toFixed(1) +
        '" height="' + (BASE - TOP) + '"/></g>');
      // 값은 막대 머리 위 하나. 강조 막대만 진하게.
      // 기준선이 글자 한가운데를 지나면 후광으로도 못 가린다(글자 속 빈 공간으로
      // 점선이 비친다). 그럴 때는 라벨을 선 위로 올린다.
      var vy = top - 9;
      refYs.forEach(function (ry) {
        if (ry > vy - 11 && ry < vy + 3) vy = (ry - 17 >= TOP - 6) ? ry - 6 : ry + 16;
      });
      p.push('<text class="' + (d.latest ? 's-hi' : 's-val') + '" x="' + cx(i).toFixed(1) +
        '" y="' + vy.toFixed(1) + '" text-anchor="middle">' + n(d.value) + '</text>');
      p.push('<text class="s-cat' + (d.latest ? ' hi' : '') + '" x="' + cx(i).toFixed(1) +
        '" y="' + CAT + '" text-anchor="middle">' + esc(d.label) + '</text>');
      if (d.note) {
        // 줄바꿈이 들어 있으면 그대로 쓴다. 어절 접기(wrap)는 좁은 칸에서
        // '구 앱 마지막' 같은 말을 세 줄로 밀어내 뒷말을 잘라 먹는다.
        var nlines = d.note.indexOf('\n') >= 0 ? d.note.split('\n').slice(0, 2) : wrap(d.note, col, 11);
        nlines.forEach(function (ln, k) {
          p.push('<text class="s-note" x="' + cx(i).toFixed(1) + '" y="' + (NOTE + k * 14) +
            '" text-anchor="middle">' + esc(ln) + '</text>');
        });
      }
    });
    p.push('</svg>');
    return '<div class="scroll-x">' + p.join('') + '</div>';
  }

  /* 축 최대값. 눈금 간격과 따로 정한다 — 눈금 간격에 맞춰 올려 버리면
     (35,789 → 40,000) 프레임 위쪽 1/3이 빈 채로 남는다. */
  function niceMax(vals, goal) {
    var m = Math.max.apply(null, vals.concat([goal])) * 1.06;
    var unit = Math.pow(10, Math.floor(Math.log10(m))) / 10;
    return Math.ceil(m / unit) * unit;
  }
  function ticksFor(max, count) {
    var step = max / count, mag = Math.pow(10, Math.floor(Math.log10(step)));
    var s = [1, 2, 2.5, 5, 10].map(function (k) { return k * mag; })
      .filter(function (k) { return k >= step; })[0] || mag * 10;
    var out = [];
    for (var v = s; v < max; v += s) out.push(Math.round(v));
    return out;
  }

  /* ── 화면 조각 ── */
  function gauge() {
    var ratioPct = Math.round((D.okr.ratio - 1) * 100);
    var order = [['mau', 'MAU'], ['wau', 'WAU'], ['dau', 'DAU']];
    var rowsHtml = order.map(function (o) {
      var a = D.axes[o[0]];
      var w = Math.max(0, Math.min(100, a.delta_pct / ratioPct * 100));
      var isNew = a.phase === 'new';
      return '<div class="grow">' +
        '<span class="ax">' + o[1] + '</span>' +
        '<div class="gtrack"><i class="' + (isNew ? 'now' : '') + '" style="width:' + w.toFixed(1) + '%"></i>' +
        '<span class="tk" style="left:0"></span><span class="tk" style="left:50%"></span>' +
        '<span class="tk goal" style="left:100%"></span></div>' +
        '<span class="gpct' + (isNew ? ' key' : '') + '">' + sign(a.delta_pct) + '</span>' +
        '<span class="note">' + n(a.current) + '명 · ' + esc(a.label) + ' <b>' +
        (isNew ? '리뉴얼' : '구 앱') + '</b></span></div>';
    }).join('');

    var dues = order.filter(function (o) { return D.axes[o[0]].due; })
      .sort(function (x, y) { return D.axes[x[0]].due < D.axes[y[0]].due ? -1 : 1; })
      .map(function (o) {
      var a = D.axes[o[0]];
      return '<div class="due"><span class="d">' + dday(a.due) + '</span>' +
        '<span class="t-cap">리뉴얼 ' + o[1] + ' 확정 ' + md(a.due) + '</span></div>';
    }).join('');

    return '<div class="card">' +
      '<div class="okr-head"><div>' +
        '<h2 class="t-section">' + D.okr.base_year + '년 평균 대비, 리뉴얼 이후 이용자 +' + ratioPct + '%</h2>' +
        '<p class="t-cap">' + D.okr.base_year +
        '년 실측 평균을 0%로 놓고 세 축을 같은 자로 잰다.</p>' +
      '</div><div class="dues">' + dues + '</div></div>' +
      '<div class="gauge"><div class="gaxis" aria-hidden="true"><div></div>' +
        '<div class="marks"><span style="left:0">' + D.okr.base_year + '년 평균 <b>0%</b></span>' +
        '<span style="left:50%; transform:translateX(-50%)"><b>+' + Math.round(ratioPct / 2) + '%</b></span>' +
        '<span style="right:0">목표 <b>+' + ratioPct + '%</b></span></div><div></div><div></div></div>' +
        rowsHtml + '</div></div>';
  }

  function viewSummary() {
    var dau = D.axes.dau, mau = D.axes.mau, wau = D.axes.wau;
    var ratioPct = Math.round((D.okr.ratio - 1) * 100);

    var newAxes = [['DAU', dau], ['WAU', wau], ['MAU', mau]].filter(function (o) { return o[1].phase === 'new'; });
    // 확정 예정인 축만, 빠른 날짜부터. 완결된 축은 due 가 사라진다.
    var waiting = [['MAU', mau], ['WAU', wau]].filter(function (o) { return o[1].due; })
      .sort(function (x, y) { return x[1].due < y[1].due ? -1 : 1; });
    var oldRef = wau.old_ref;

    var verdict = '<div class="card">' +
      '<h2 class="t-section">리뉴얼 이후 실측이 나온 축은 ' +
      newAxes.map(function (o) { return o[0] + ' ' + sign(o[1].delta_pct); }).join(', ') +
      '다. ' + D.okr.base_year + '년 같은 자로 잰 평균 위에 있다.</h2>' +
      '<p style="margin-top:var(--sp-3); max-width:var(--w-text)">구 앱의 마지막 성적은 MAU ' +
      sign(mau.delta_pct) + (oldRef ? ', WAU ' + sign(oldRef.delta_pct) + '(' + esc(oldRef.label) + ')' : '') +
      '이었다. 리뉴얼 첫 ' + D.window.days + '일은 DAU가 ' + gap(dau.delta_pct, mau.delta_pct) +
      (oldRef ? ', WAU가 ' + gap(wau.delta_pct, oldRef.delta_pct) : '') +
      '다. 대규모 개편에서 흔한 초기 이탈은 없었다. 목표 +' + ratioPct + '%까지는 ' +
      D.evidence.gap_pp.toFixed(1) + '%p 남았다. ' +
      waiting.map(function (o) { return o[0] + '는 ' + md(o[1].due); }).join(', ') +
      '에 리뉴얼만 담긴 구간이 완결된다.</p></div>';

    var steps = [{ d: md(D.as_of), t: '현재 · ' + D.window.days + '일차',
                   x: newAxes.map(function (o) { return o[0]; }).join('·') + ' 판정 가능' }]
      .concat(waiting.map(function (o) {
        return { d: md(o[1].due), t: '리뉴얼 ' + o[0] + ' 확정',
                 x: o[0] === 'WAU' ? md(D.window.start) + '부터 순수 7일 창' : 'OKR 첫 성적표' };
      }));
    var plan = '<div class="block"><h3 class="t-section">판정 일정</h3>' +
      '<p class="t-cap">완결 구간이 채워지는 순서다.</p><div class="card plan">' +
      steps.map(function (s) {
        return '<div class="pstep"><span class="d">' + s.d + '</span><span class="t">' + s.t +
          '</span><span class="t-cap">' + s.x + '</span></div>';
      }).join('') + '</div></div>';

    var maxAbs = Math.max.apply(null, D.cumulative.map(function (c) { return Math.abs(c.pct); }));
    var span = Math.ceil((maxAbs * 1.15) / 5) * 5, zero = 20;
    var rowsHtml = D.cumulative.map(function (c) {
      var w = Math.abs(c.pct) / span * (100 - zero);
      var left = c.pct >= 0 ? zero : zero - w;
      var fmt = function (v) { return c.digits ? Number(v).toFixed(c.digits) : n(v); };
      return '<div class="drow"><span class="dname">' + esc(c.name) +
        (c.sub ? '<span class="sub">' + esc(c.sub) + '</span>' : '') + '</span>' +
        '<span class="val">' + fmt(c.value) + '</span><span class="val base">' + fmt(c.base) + '</span>' +
        '<span class="dbar"><span class="zero" style="left:' + zero + '%"></span>' +
        '<i style="left:' + left.toFixed(1) + '%; width:' + w.toFixed(1) + '%; background:var(--' +
        (c.pct >= 0 ? 'success' : 'danger') + ')"></i></span>' +
        '<span class="dchip ' + cls(c.pct) + '">' + sign(c.pct) + '</span></div>';
    }).join('');

    var cum = '<div class="block"><h3 class="t-section">리뉴얼 ' + D.window.days + '일 누적 비교</h3>' +
      '<p class="t-cap">' + md(D.window.start) + '~' + md(D.window.end) +
      '를 직전 4주의 같은 요일 창 평균과 견줬다. 요일 구성을 맞춘 단기 비교다.</p>' +
      '<div class="card card-flush"><div class="drow head"><span>지표</span><span class="r">리뉴얼 후</span>' +
      '<span class="r">기준</span><span>증감 폭</span><span class="r">증감</span></div>' + rowsHtml + '</div></div>';

    return gauge() + verdict + plan + cum;
  }

  function metricView(key, label, unitLabel, series, opts) {
    var a = D.axes[key];
    var vals = series.map(function (s) { return s.value; });
    var max = niceMax(vals, a.target);
    var stats = [{ k: 'OKR 목표', v: n(a.target) }, { k: '남은 폭', v: sign(a.gap_pct) }];
    if (a.due) stats.push({ k: '리뉴얼 확정', v: md(a.due) });
    if (a.prev_pct !== undefined) stats.push({ k: '직전 주 대비', v: sign(a.prev_pct), c: cls(a.prev_pct) });

    return '<div class="card card-flush"><div class="dhead"><div class="dmain">' +
      '<span class="t-cap">' + esc(label) + '</span>' +
      '<span class="t-display">' + n(a.current) + '<span>명</span></span>' +
      '<span class="dsub">' + D.okr.base_year + '년 ' + esc(unitLabel) + ' ' + n(a.baseline) +
      '명 대비 <b class="' + cls(a.delta_pct) + '">' + sign(a.delta_pct) + '</b></span></div>' +
      '<div class="dstats">' + stats.map(function (s) {
        return '<div class="dstat"><span class="t-cap">' + s.k + '</span><span class="v ' +
          (s.c || '') + '">' + s.v + '</span></div>'; }).join('') + '</div></div>' +
      '<div class="dbody">' +
      chart(series, {
        max: max, ticks: ticksFor(max, 5), goal: a.target,
        goalLabel: 'OKR 목표 ' + n(a.target),
        avg: a.baseline, avgLabel: D.okr.base_year + '년 ' + unitLabel + ' ' + n(a.baseline),
        split: opts.split, splitLabel: opts.splitLabel, alt: opts.alt
      }) +
      '<div class="legend">' + opts.legend + '</div>' +
      '<figcaption>' + opts.caption + '</figcaption></div></div>';
  }

  function viewMau() {
    var s = D.series.mau.map(function (m, i, arr) {
      return { label: m.label, value: m.value, kind: 'old',
        latest: i === arr.length - 1, note: i === arr.length - 1 ? '최근 완결월' : '',
        tip: m.label + '\nMAU ' + n(m.value) + '명\n' + D.okr.base_year + '년 평균 대비 ' +
             sign(Math.round((m.value / D.axes.mau.baseline - 1) * 1000) / 10) };
    });
    var a = D.axes.mau, best = D.series.mau.reduce(function (x, y) { return y.value > x.value ? y : x; });
    return metricView('mau', 'MAU · 최근 완결월 ' + a.label + ' · 구 앱', '평균', s, {
      alt: D.as_of.slice(0, 4) + '년 완결월 MAU 막대그래프. 모든 달이 OKR 목표선 아래에 있다.',
      legend: '<span><i style="background:var(--data-ctx)"></i>월별 MAU</span>' +
        '<span><i style="background:var(--data-focus)"></i>' + a.label + '</span>' +
        '<span><i class="ln"></i>OKR 목표 ' + n(a.target) + '명</span>' +
        '<span><i class="ln avg"></i>' + D.okr.base_year + '년 평균 ' + n(a.baseline) + '명</span>',
      caption: D.as_of.slice(0, 4) + '년 완결 ' + D.series.mau.length +
        '개월이 모두 목표선 아래다. 최고치였던 ' + best.label + ' ' + n(best.value) + '명도 목표의 ' +
        (best.value / a.target * 100).toFixed(1) + '%였다. <b>다음 달 MAU가 ' + n(a.target) +
        '명을 넘어야 OKR이 성립한다.</b> 리뉴얼만 담기는 첫 완결월이기도 하다.'
    });
  }

  /* 주차 표기. 배포 후를 1주차부터 세고, 배포 전은 '2주 전'처럼 거슬러 센다.
     데이터가 옛 형식이면(week_label 없음) 날짜 라벨로 물러선다. */
  function wlabel(w) { return w.week_label || w.label; }

  /* 리뉴얼 주차 표. 분리 기준일부터 7일씩 끊은 주가 한 행씩 쌓인다.
     맨 위에 구 앱 마지막 완결주를 기준 행으로 둔다 — 기준이 표 안에 없으면
     늘었는지 줄었는지를 다른 화면에서 찾아와야 한다. */
  function weekTable() {
    var W = D.weeks;
    if (!W || !W.rows || !W.rows.length) return '';
    var rows = (W.ref ? [W.ref] : []).concat(W.rows);
    var lastFull = null;
    W.rows.forEach(function (r) { if (!r.partial) lastFull = r; });
    function pcell(v, extra) {
      var has = v !== null && v !== undefined;
      return '<td class="r ' + (has ? cls(v) : '') + '">' + (has ? sign(v) : '-') +
        (extra ? '<span class="sub">' + esc(extra) + '</span>' : '') + '</td>';
    }
    var body = rows.map(function (r) {
      return '<tr' + (r === lastFull ? ' class="total"' : '') + '><td>' + esc(r.label) +
        '<span class="sub">' + esc(r.range) + (r.partial ? ' · 진행중 ' + r.days + '일' : '') +
        '</span></td>' +
        '<td class="r">' + n(r.wau) + '</td><td class="r">' + n(r.new_users) + '</td>' +
        '<td class="r">' + Number(r.sessions_per).toFixed(2) + '</td>' +
        '<td class="r">' + Number(r.pv_per).toFixed(2) + '</td>' +
        pcell(r.vs_base) +
        pcell(r.partial ? r.vs_prev_same : r.vs_prev,
              r.partial ? '같은 ' + r.days + '일 창' : (r.vs_prev_note || '')) +
        '</tr>';
    }).join('');
    var last = W.rows[W.rows.length - 1];
    var partial = last.partial ? last : null;
    return '<div class="block"><h3 class="t-section">리뉴얼 주차별 진행</h3>' +
      '<p class="t-cap">분리 기준일 ' + md(W.split) + '(' + esc(W.anchor) + ')부터 7일씩 끊은 주차다. ' +
      '달력 주가 아니라 ' + esc(W.anchor) + '~' + esc(WD_PREV[W.anchor]) + ' 격자여서 1주차가 ' +
      md(W.split) + '에 바로 시작한다. 주가 지날수록 행이 하나씩 늘어난다.</p>' +
      '<div class="card card-flush"><div class="tbl-wrap"><table>' +
      '<thead><tr><th>주차</th><th class="r">순이용자</th><th class="r">신규</th>' +
      '<th class="r">세션/인</th><th class="r">화면조회/인</th><th class="r">' +
      D.okr.base_year + '년 대비</th><th class="r">직전 주 대비</th></tr></thead>' +
      '<tbody>' + body + '</tbody></table></div></div>' +
      '<p class="t-cap" style="margin-top:var(--sp-2); max-width:var(--w-text)">' +
      '순이용자는 주마다 GA4에 다시 물어본 7일 실측이다 — 일별 값을 더하면 중복 제거가 풀려 ' +
      '순이용자가 되지 않는다. ' +
      (partial ? '진행중인 ' + esc(partial.label) + '는 완결주와 견주지 않고 직전 주의 같은 ' +
                 partial.days + '일 창' +
                 (partial.prev_same ? '(' + n(partial.prev_same) + '명)' : '') + '하고만 비교했다. ' : '') +
      (W.ref ? '기준 행은 구 앱 마지막 완결주다. 배포일이 든 혼재주는 뺐다.' : '') + '</p></div>';
  }

  function viewWau() {
    var a = D.axes.wau, isNew = a.phase === 'new';
    var splitIdx = D.series.wau.findIndex(function (w) { return w.kind !== 'old'; });
    var s = D.series.wau.map(function (w) {
      // 축에는 주차, 그 아래 한 줄에 실제 기간. 둘을 같이 봐야 '1주차'가
      // 언제인지 되묻지 않는다. wrap() 이 공백에서 접어 두 줄로 만든다.
      var extra = w.kind === 'mixed' ? '판정 제외' : (w.latest && w.kind === 'old' ? '구 앱 마지막' : '');
      return { label: wlabel(w), value: w.value, kind: w.kind, latest: w.latest,
        note: w.range + (extra ? '\n' + extra : ''),
        tip: wlabel(w) + ' · ' + w.range + '\nWAU ' + n(w.value) + '명\n' +
             (w.kind === 'mixed' ? '배포일이 들어 전후가 섞여 판정에 쓰지 않는다'
                                 : D.okr.base_year + '년 평균 대비 ' + sign(Math.round((w.value / a.baseline - 1) * 1000) / 10)) };
    });
    return metricView('wau', 'WAU · ' + (isNew ? '리뉴얼 ' : '마지막 완결주 ') +
        (a.week_label ? a.week_label + ' · ' : '') + a.label +
        (isNew ? '' : ' · 구 앱'), '주 평균', s, {
      split: isNew ? splitIdx : -1, splitLabel: '리뉴얼 시작',
      alt: '주간 순이용자 막대그래프. ' + (isNew ? '리뉴얼 주도 목표선 아래다.' : '목표선을 넘은 주는 없다.'),
      legend: '<span><i style="background:var(--data-ctx)"></i>구 앱</span>' +
        '<span><i class="hx"></i>배포일 포함 주 · 혼재</span>' +
        // 리뉴얼 주가 둘 이상 쌓인 뒤에야 --data-key 로 그려지는 막대가 생긴다.
        (s.some(function (w) { return w.kind === 'new' && !w.latest; })
          ? '<span><i style="background:var(--data-key)"></i>리뉴얼</span>' : '') +
        '<span><i style="background:var(--data-focus)"></i>' +
        (isNew ? '리뉴얼 최신 완결주' : '구 앱 마지막 완결주') + '</span>' +
        '<span><i class="ln"></i>OKR 목표 ' + n(a.target) + '명</span>',
      caption: '<b>주는 달력 주(일~토)가 아니라 분리 기준일 요일에 앵커를 건 ' + esc(a.anchor) +
        '~' + esc(WD_PREV[a.anchor]) + ' 7일이다.</b> 리뉴얼은 ' + md(D.release.split_date) + '(' + esc(a.anchor) +
        ')에 갈렸다. 달력 주 격자에서는 그 주가 구 앱과 섞여 통째로 못 쓰이고 다음 주 끝까지 기다려야 하는데, ' +
        '앵커를 옮기면 ' + md(D.window.start) + '부터 7일이 그대로 한 주가 되고 ' +
        '비교 대상 직전 주들도 같은 요일 구성이라 요일 편차가 상쇄된다. ' +
        '7일 순이용자는 주마다 GA4에 다시 물어본 실측이다 — 일별 값을 더하면 중복 제거가 풀려 순이용자가 되지 않는다. ' +
        '배포일이 든 주는 배포 시각 전후가 섞여 판정에서 뺀다.' +
        (isNew ? '' : ' 리뉴얼만 담긴 첫 7일 창은 ' + md(a.due) + '에 확정된다.')
    }) + weekTable();
  }

  function viewDau() {
    var a = D.axes.dau, e = D.evidence;
    var splitIdx = D.series.dau.findIndex(function (d) { return d.kind === 'new'; });
    var s = D.series.dau.map(function (d) {
      return { label: d.label, value: d.value, kind: d.kind, latest: d.latest,
        note: d.kind === 'deploy' ? '배포일' : '',
        tip: d.label + ' · ' + (d.kind === 'old' ? '구 앱' : d.kind === 'deploy' ? '배포일' : '리뉴얼') +
             '\n' + n(d.value) + '명' + (d.kind === 'deploy' ? '\n배포 전후가 섞여 어느 쪽에도 넣지 않는다' : '') };
    });
    return metricView('dau', 'DAU · 리뉴얼 ' + a.label + ' 평균', '평일 평균', s, {
      split: splitIdx, splitLabel: '리뉴얼 시작',
      alt: '평일 일별 순이용자 막대그래프. 리뉴얼 첫날 이후 내려간다.',
      legend: '<span><i style="background:var(--data-ctx)"></i>구 앱</span>' +
        '<span><i class="hx"></i>배포일 · 혼재</span>' +
        '<span><i style="background:var(--data-key)"></i>리뉴얼</span>' +
        '<span><i style="background:var(--data-focus)"></i>리뉴얼 1일차</span>' +
        '<span><i class="ln"></i>OKR 목표 ' + n(a.target) + '명</span>',
      caption: '주말은 빼고 평일만 그렸다. ' + D.okr.base_year + '년 주말 평균은 ' + n(D.baseline.dau_weekend) +
        '명으로 평일 ' + n(a.baseline) + '명의 ' + Math.round(D.baseline.dau_weekend / a.baseline * 100) +
        '% 수준이라, 섞으면 기준선이 무너진다. <b>리뉴얼 첫날은 목표선을 넘었지만 ' +
        e.dau_last.label + ' ' + n(e.dau_last.value) + '명까지 내려왔다.</b> 초기 관심이 빠진 것으로 본다. ' +
        '2주차가 ' + D.okr.base_year + '년 평일 평균 위로 돌아오는지가 다음 판정점이다.'
    });
  }

  function viewBase() {
    var b = D.baseline, y = D.okr.base_year;
    var how = [
      ['MAU', D.axes.mau, y + '년 월간 순이용자 ' + b.mau_n + '개 값의 평균', '합계 ' + n(b.mau_sum) + ' ÷ ' + b.mau_n],
      ['WAU', D.axes.wau, y + '년 완결주 ' + b.wau_n + '주 평균',
       '주는 분리 기준일 요일 앵커 ' + esc(D.axes.wau.anchor) + '~' + esc(WD_PREV[D.axes.wau.anchor]) +
       ' 7일. 연초·연말에 걸친 부분주 ' + b.wau_part + '주는 7일이 안 차 제외'],
      ['DAU', D.axes.dau, y + '년 평일 ' + b.dau_n + '일 평균',
       '주말 ' + b.dau_weekend_n + '일 평균은 ' + n(b.dau_weekend) + '명. 함께 넣으면 ' +
       n(b.dau_all) + '명까지 눌려 기준이 왜곡된다']
    ];
    var t1 = '<div class="block"><h3 class="t-section">기준선 세 개</h3>' +
      '<p class="t-cap">축마다 단위가 달라 산출 방식도 다르다. OKR 목표는 각 기준선에 ' +
      D.okr.ratio + '를 곱한 값이다.</p><div class="card card-flush"><div class="tbl-wrap"><table>' +
      '<thead><tr><th>축</th><th class="r">' + y + '년 기준선</th><th class="r">OKR 목표</th><th>산출 방식</th></tr></thead><tbody>' +
      how.map(function (r) {
        return '<tr><td>' + r[0] + '</td><td class="r">' + n(r[1].baseline) + '명</td>' +
          '<td class="r">' + n(r[1].target) + '명</td><td>' + esc(r[2]) +
          '<span class="sub">' + esc(r[3]) + '</span></td></tr>'; }).join('') +
      '</tbody></table></div></div></div>';

    /* 2025 vs 2026 월별 비교. 산출법을 두 해 모두 같게 맞춰야 나란히 놓을 수 있다. */
    var AX = [['mau', 'MAU', '월간 순이용자'], ['wau', 'WAU', '주 평균'], ['dau', 'DAU', '평일 평균']];
    var done = D.compare.months.filter(function (m) { return m.mau.cur !== null; });

    function cmpTable(key, title, unit) {
      var body = D.compare.months.map(function (m) {
        var c = m[key];
        return '<tr><td>' + m.month + '월</td>' +
          '<td class="r">' + n(c.base) + '</td>' +
          '<td class="r">' + (c.cur === null ? '-' : n(c.cur)) + '</td>' +
          '<td class="r ' + (c.pct === null ? '' : cls(c.pct)) + '">' +
          (c.pct === null ? '-' : sign(c.pct)) + '</td></tr>';
      }).join('');
      var b = done.reduce(function (a, m) { return a + m[key].base; }, 0) / done.length;
      var c2 = done.reduce(function (a, m) { return a + m[key].cur; }, 0) / done.length;
      var p2 = Math.round((c2 / b - 1) * 1000) / 10;
      body += '<tr class="total"><td>1~' + done.length + '월</td>' +
        '<td class="r">' + n(Math.round(b)) + '</td><td class="r">' + n(Math.round(c2)) + '</td>' +
        '<td class="r ' + cls(p2) + '">' + sign(p2) + '</td></tr>';
      return '<div class="card card-flush"><div class="cmp-head"><span class="m">' + title +
        '</span><span class="t-cap">' + unit + '</span></div><div class="tbl-wrap"><table>' +
        '<thead><tr><th>월</th><th class="r">' + D.compare.base_year + '년</th>' +
        '<th class="r">' + D.compare.cur_year + '년</th><th class="r">증감</th></tr></thead>' +
        '<tbody>' + body + '</tbody></table></div></div>';
    }

    var sm = D.compare.summary;
    // 두 비교가 섞이면 헷갈린다. 같은 달끼리 맞춘 값과 OKR 기준선 대비 값을 나눠 적는다.
    function likePct(key) {
      var b = done.reduce(function (a, m) { return a + m[key].base; }, 0) / done.length;
      var c = done.reduce(function (a, m) { return a + m[key].cur; }, 0) / done.length;
      return Math.round((c / b - 1) * 1000) / 10;
    }
    var t2 = '<div class="block"><h3 class="t-section">' + D.compare.base_year + '년 대비 ' +
      D.compare.cur_year + '년 월별 비교</h3>' +
      '<p class="t-cap">두 해 모두 같은 방식으로 냈다. 월은 월간 순이용자, 주는 완결주 평균(분리 기준일 요일 앵커 ' +
      esc(D.axes.wau.anchor) + '~' + esc(WD_PREV[D.axes.wau.anchor]) + '), 일은 평일 평균이다. ' +
      D.compare.cur_year + '년은 완결월만 넣었고, 진행중인 달과 아직 오지 않은 달은 ' +
      '<span class="num">-</span> 로 둔다. 진행중 구간을 완결값과 비교하면 부호가 뒤집힌다.</p>' +
      '<div class="cmp-grid">' + AX.map(function (a) { return cmpTable(a[0], a[1], a[2]); }).join('') + '</div>' +
      '<p style="max-width:var(--w-text); margin-top:var(--sp-2)">' +
      '<b>같은 달끼리 맞춰 보면</b> 1~' + done.length + '월 평균이 MAU ' + sign(likePct('mau')) +
      ', WAU ' + sign(likePct('wau')) + ', DAU ' + sign(likePct('dau')) + '다. ' +
      'OKR 기준선(' + D.compare.base_year + '년 12개월 전체)과 견주면 MAU ' + sign(sm.mau.pct) +
      ', WAU ' + sign(sm.wau.pct) + ', DAU ' + sign(sm.dau.pct) + '로 조금 완만하게 나오는데, ' +
      D.compare.base_year + '년 9~12월이 상대적으로 낮아 연평균을 끌어내린 탓이다. ' +
      '<b>실제 하락 폭은 같은 달끼리 맞춘 앞의 수치에 가깝다.</b> ' +
      '축이 아래로 갈수록 낙폭이 커진다. 다녀간 사람 수(MAU)보다 얼마나 자주 오는지(DAU)가 더 많이 빠졌다. ' +
      '연휴가 낀 달은 평일 수 자체가 줄어 양쪽 해 모두 낮게 나온다.</p></div>';

    return t1 + t2;
  }

  function viewDiff() {
    var e = D.evidence, a = D.axes, y = D.okr.base_year;
    var pvRow = D.cumulative.filter(function (c) { return c.name.indexOf('화면조회 / ') === 0; })[0];
    var good = [
      { f: sign(a.dau.delta_pct), u: 'DAU · ' + y + '년 평균 대비', h: '배포 직후 이탈이 없었다',
        p: '구 앱의 마지막 성적 MAU ' + sign(a.mau.delta_pct) +
           (a.wau.old_ref ? ' · WAU ' + sign(a.wau.old_ref.delta_pct) : '') +
           '보다 위에서 출발했다. 대규모 리뉴얼에서 흔한 초기 이탈은 나타나지 않았다.' },
      { f: sign(e.engagement.pct), u: '체류 참여', h: '참여가 두 배 넘게 늘었다',
        p: 'user_engagement ' + n(e.engagement.cur) + '명 대 ' + n(e.engagement.base) + '명. ' +
           D.window.days + '일 내내 기준을 웃돌아 하루짜리 급등이 아니다.' },
      { f: sign(e.service.pct), u: '서비스 진입', h: '서비스 탐색이 늘었다',
        p: '서비스 화면 ' + n(e.service.cur) + '명 대 ' + n(e.service.base) + '명. 직전 주 같은 요일 대비다.' },
      { f: sign(pvRow.pct), u: '화면조회 / 1인', h: '1인당 이용 깊이가 늘었다',
        p: pvRow.value.toFixed(2) + '회 대 ' + pvRow.base.toFixed(2) + '회. 1회성 코치마크와 경로 재편이 포함돼 있어, 제외하면 ' +
           sign(e.pv_per_user_ex_pct) + '다.', badge: '추정 · 계측 검증 필요' }
    ];
    var bad = [
      { f: e.gap_pp.toFixed(1) + '%p', u: '목표까지 남은 폭', h: '목표까지의 거리가 거의 줄지 않았다',
        p: '구 앱 ' + sign(a.mau.delta_pct) + '에서 리뉴얼 ' + sign(a.dau.delta_pct) + '로 ' +
           (a.dau.delta_pct - a.mau.delta_pct).toFixed(1) + '%p 좁힌 게 전부다. 아직 리뉴얼 ' +
           D.window.days + '일 구간의 ' + (a.wau.phase === 'new' ? 'WAU·DAU' : 'DAU') +
           ' 실측만 반영된 값이다.' },
      { f: sign(e.dau_decay_pct), u: '1일차 → 마지막 날', h: '첫날 상승분이 며칠 만에 사라졌다',
        p: e.dau_first.label + ' ' + n(e.dau_first.value) + '명에서 ' + e.dau_last.label + ' ' +
           n(e.dau_last.value) + '명으로 내려왔다. 직전 주 평일 평균과 견주면 ' + sign(a.dau.prev_pct) +
           '로 사실상 제자리다. 초기 관심이 빠진 것으로 본다.', badge: '추정' },
      { f: e.cert.times + '배', u: '회사인증 화면', h: '재인증과 재로그인 마찰이 생겼다',
        p: '회사인증 화면 ' + n(e.cert.cur) + '명 대 ' + n(e.cert.base) + '명, 로그인 화면 ' +
           sign(e.login.pct) + '. 배포로 기존 세션과 회사인증이 초기화된 것으로 추정한다.', badge: '추정' }
    ];
    function panel(title, items, tone) {
      return '<div class="card card-flush"><div class="phead"><h3 class="t-section">' + title +
        '</h3><span class="cnt">' + items.length + '건</span></div>' +
        items.map(function (it) {
          return '<div class="pitem"><div class="pfig ' + tone + '">' + it.f + '<span class="u">' +
            esc(it.u) + '</span></div><div class="pbody"><h4>' + esc(it.h) + '</h4><p>' + it.p + '</p>' +
            (it.badge ? '<span class="badge badge-wait">' + esc(it.badge) + '</span>' : '') +
            '</div></div>'; }).join('') + '</div>';
    }
    return '<div class="cols">' + panel('진보', good, 'pos') + panel('퇴보', bad, 'neg') + '</div>';
  }

  var RENDER = { 't-sum': viewSummary, 't-mau': viewMau, 't-wau': viewWau,
                 't-dau': viewDau, 't-base': viewBase, 't-diff': viewDiff };

  function skeleton() {
    var lines = '';
    for (var i = 0; i < 6; i++) lines += '<div class="skel skel-line" style="width:' + (55 + i * 7) + '%"></div>';
    return '<div class="card"><div class="skel-wrap">' + lines + '</div></div>';
  }

  function paint() {
    if (!D.axes) { app.innerHTML = skeleton(); return; }
    app.innerHTML = '<div class="view" id="' + VIEW[current] + '">' + RENDER[current]() + '</div>';
    document.querySelector('[data-slot="crumb"]').textContent = NAMES[current][0];
    document.querySelector('[data-slot="ptitle"]').textContent = NAMES[current][1];
    ['mau', 'wau', 'dau'].forEach(function (k) {
      document.querySelector('[data-slot="nav-' + k + '"]').textContent = sign(D.axes[k].delta_pct);
    });
    document.querySelector('[data-slot="nav-diff"]').textContent = '4 / 3';
    document.querySelector('[data-slot="sidefoot"]').innerHTML =
      'GA4 속성 406530510<br>지표는 activeUsers, 중복 제거 순이용자<br>배포 ' +
      md(D.release.date) + ' · 분리 기준일 ' + md(D.release.split_date);
    document.querySelector('[data-slot="stamp"]').innerHTML =
      '데이터 기준 <b>' + D.last_full + '</b> · 갱신 <b>' + D.generated_at.replace('T', ' ').replace('Z', ' UTC') + '</b>';
  }

  function setConn(kind, text) {
    conn.className = 'badge badge-' + kind;
    conn.textContent = text;
  }

  /* ── 실시간 조회 ────────────────────────────────────────────
     같은 출처의 renewal.json 을 받아 온다. 아티팩트·로컬 파일처럼 외부
     요청이 막힌 곳에서는 실패하는데, 그때는 HTML 안의 스냅샷으로 그린다. */
  function load(manual) {
    if (manual) { setConn('prog', '갱신 중'); }
    return fetch('./renewal.json?t=' + Date.now(), { cache: 'no-store' })
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (json) {
        if (!json.axes) throw new Error('형식이 올바르지 않습니다');
        var changed = json.generated_at !== D.generated_at;
        D = json;
        errBox.hidden = true;
        paint();
        setConn('done', changed && manual ? '갱신 완료' : '실시간');
        return true;
      })
      .catch(function (err) {
        if (D.axes) {
          setConn('wait', '스냅샷');
          if (manual) {
            errBox.hidden = false;
            errMsg.textContent = '최신 데이터를 받지 못했습니다. ' + D.last_full +
              ' 기준 스냅샷을 그대로 보여 줍니다. (' + err.message + ')';
          }
        } else {
          setConn('rejt', '연결 실패');
          errBox.hidden = false;
          errMsg.textContent = '데이터 파일(renewal.json)을 읽을 수 없습니다. (' + err.message + ')';
          app.innerHTML = '';
        }
        return false;
      });
  }

  /* ── 이벤트 ── */
  document.addEventListener('mousemove', function (e) {
    var g = e.target.closest ? e.target.closest('.bar[data-tip]') : null;
    if (!g) { tip.style.opacity = '0'; return; }
    tip.textContent = g.getAttribute('data-tip');
    tip.style.opacity = '1';
    tip.style.left = Math.min(e.clientX + 16, window.innerWidth - 280) + 'px';
    tip.style.top = Math.max(e.clientY - 64, 8) + 'px';
  });

  var tabs = Array.prototype.slice.call(document.querySelectorAll('.nbtn'));
  function select(btn) {
    tabs.forEach(function (t) { t.setAttribute('aria-selected', t === btn ? 'true' : 'false'); });
    current = btn.id;
    if (location.hash !== '#' + btn.id.slice(2)) {
      history.replaceState(null, '', '#' + btn.id.slice(2));
    }
    paint();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
  tabs.forEach(function (t, i) {
    t.addEventListener('click', function () { select(t); });
    t.addEventListener('keydown', function (e) {
      var d = (e.key === 'ArrowDown' || e.key === 'ArrowRight') ? 1
            : (e.key === 'ArrowUp' || e.key === 'ArrowLeft') ? -1 : 0;
      if (!d) return;
      e.preventDefault();
      var next = tabs[(i + d + tabs.length) % tabs.length];
      next.focus(); select(next);
    });
  });
  document.getElementById('reload').addEventListener('click', function () { load(true); });
  document.getElementById('retry').addEventListener('click', function () { load(true); });

  var fromHash = 't-' + (location.hash || '').replace('#', '');
  if (VIEW[fromHash]) {
    current = fromHash;
    tabs.forEach(function (t) { t.setAttribute('aria-selected', t.id === current ? 'true' : 'false'); });
  }
  window.addEventListener('hashchange', function () {
    var id = 't-' + (location.hash || '').replace('#', '');
    if (VIEW[id] && id !== current) {
      var btn = document.getElementById(id);
      if (btn) select(btn);
    }
  });

  paint();
  load(false);
  setInterval(function () { load(false); }, POLL_MS);
})();
</script>

</body>
</html>
